<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD AIR — a MOSH Production</title>
<style>
  :root{
    --phosphor:#c8ffc8;
    --amber:#ffb000;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#050505;
    overflow:hidden;
    font-family:"Courier New",Courier,monospace;
    cursor:crosshair;
  }
  #stage{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  #tv{
    position:relative;
    width:min(96vw,calc(96vh*1.3333));
    aspect-ratio:4/3;
    background:#000;
    border-radius:2.5% / 3.5%;
    box-shadow:0 0 120px rgba(40,60,40,.25), inset 0 0 80px rgba(0,0,0,.9);
    overflow:hidden;
  }
  canvas#screen{
    position:absolute;inset:0;
    width:100%;height:100%;
    image-rendering:pixelated;
  }
  /* CRT overlays */
  #scanlines{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.28) 3px, rgba(0,0,0,.28) 4px);
    mix-blend-mode:multiply;
  }
  #vignette{
    position:absolute;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 92%, rgba(0,0,0,.9) 100%);
  }
  #curve{
    position:absolute;inset:0;pointer-events:none;z-index:7;
    background:radial-gradient(ellipse at 50% 38%,
      rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 60%);
  }
  #flicker{
    position:absolute;inset:0;pointer-events:none;z-index:8;
    background:#fff;opacity:0;
  }
  #osd{
    position:absolute;left:4%;top:5%;z-index:9;pointer-events:none;
    color:var(--phosphor);
    font-size:clamp(10px,2.4vh,22px);
    font-weight:bold;
    text-shadow:0 0 6px rgba(120,255,120,.8), 2px 0 0 rgba(255,0,0,.25), -2px 0 0 rgba(0,80,255,.25);
    letter-spacing:.12em;
    white-space:pre;
  }
  #osdclock{
    position:absolute;right:4%;top:5%;z-index:9;pointer-events:none;
    color:var(--phosphor);
    font-size:clamp(10px,2.4vh,22px);
    font-weight:bold;
    text-shadow:0 0 6px rgba(120,255,120,.8);
    letter-spacing:.12em;
  }
  #subtitle{
    position:absolute;left:0;right:0;bottom:7%;z-index:9;pointer-events:none;
    text-align:center;
    color:#e8e8e8;
    font-size:clamp(11px,2.6vh,24px);
    text-shadow:0 0 8px rgba(0,0,0,.9),0 0 2px #000;
    letter-spacing:.06em;
    padding:0 8%;
  }
  #trackbar{
    position:absolute;left:0;right:0;bottom:2.5%;z-index:9;pointer-events:none;
    text-align:center;
    color:var(--amber);
    font-size:clamp(10px,2.2vh,20px);
    text-shadow:0 0 6px rgba(255,176,0,.7);
    letter-spacing:.15em;
  }
  #powerbar{
    position:absolute;left:4%;bottom:2.5%;z-index:9;pointer-events:none;
    color:var(--phosphor);
    font-size:clamp(10px,2.2vh,20px);
    font-weight:bold;
    text-shadow:0 0 6px rgba(120,255,120,.8);
    letter-spacing:.08em;
    white-space:pre;
  }
  #powerbar.low{ color:#ff5544; text-shadow:0 0 8px rgba(255,60,40,.8); }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="stage">
  <div id="tv">
    <canvas id="screen" width="640" height="480"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="curve"></div>
    <div id="flicker"></div>
    <div id="osd"></div>
    <div id="osdclock"></div>
    <div id="subtitle"></div>
    <div id="trackbar"></div>
    <div id="powerbar"></div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   DEAD AIR — an analog horror game — a MOSH production
   You are the overnight master-control operator at WKRX-TV.
   Keep the signal clean until sunrise. Something is inside it.
   ============================================================ */

const W = 640, H = 480;
const cv = document.getElementById("screen");
const cx = cv.getContext("2d");
const osd = document.getElementById("osd");
const osdclock = document.getElementById("osdclock");
const subEl = document.getElementById("subtitle");
const trackEl = document.getElementById("trackbar");
const flickerEl = document.getElementById("flicker");
const powerEl = document.getElementById("powerbar");
const vigEl = document.getElementById("vignette");

/* ---------- utility ---------- */
const rnd = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const hash = n => { const v=Math.sin(n*127.1)*43758.5453; return v-Math.floor(v); };

/* ---------- audio (all procedural, WebAudio) ---------- */
let AC=null, master=null, humOsc=null, humGain=null;
let staticSrc=null, staticGain=null, droneOsc=null, droneGain=null;
let whisperGain=null, breathGain=null, breathLFO=null, riserGain=null;
function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);

  // 60 Hz mains hum + faint 120 Hz harmonic
  humOsc = AC.createOscillator(); humOsc.type="sine"; humOsc.frequency.value=60;
  const hum2 = AC.createOscillator(); hum2.type="sine"; hum2.frequency.value=120;
  humGain = AC.createGain(); humGain.gain.value=0.012;
  const hum2g = AC.createGain(); hum2g.gain.value=0.005;
  humOsc.connect(humGain).connect(master);
  hum2.connect(hum2g).connect(master);
  humOsc.start(); hum2.start();

  // looping white-noise bed for static
  const len = AC.sampleRate*2;
  const buf = AC.createBuffer(1,len,AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  staticSrc = AC.createBufferSource(); staticSrc.buffer=buf; staticSrc.loop=true;
  const flt = AC.createBiquadFilter(); flt.type="bandpass"; flt.frequency.value=2400; flt.Q.value=0.4;
  staticGain = AC.createGain(); staticGain.gain.value=0.0;
  staticSrc.connect(flt).connect(staticGain).connect(master);
  staticSrc.start();

  // low dread drone (rises as the entity gets close)
  droneOsc = AC.createOscillator(); droneOsc.type="sawtooth"; droneOsc.frequency.value=38;
  const dflt = AC.createBiquadFilter(); dflt.type="lowpass"; dflt.frequency.value=140;
  droneGain = AC.createGain(); droneGain.gain.value=0.0;
  droneOsc.connect(dflt).connect(droneGain).connect(master);
  droneOsc.start();
  // second drone a hair off-pitch: a 0.7 Hz beat you feel more than hear
  const drone2 = AC.createOscillator(); drone2.type="sawtooth"; drone2.frequency.value=38.7;
  drone2.connect(dflt); drone2.start();

  // breathing bed: lowpassed noise, amplitude riding a slow inhale/exhale LFO
  const bsrc = AC.createBufferSource(); bsrc.buffer=buf; bsrc.loop=true;
  const blp = AC.createBiquadFilter(); blp.type="lowpass"; blp.frequency.value=400;
  breathLFO = AC.createOscillator(); breathLFO.type="sine"; breathLFO.frequency.value=.28;
  const blg = AC.createGain(); blg.gain.value=.5;
  const binner = AC.createGain(); binner.gain.value=.5;
  breathLFO.connect(blg).connect(binner.gain);
  breathGain = AC.createGain(); breathGain.gain.value=0;
  bsrc.connect(blp).connect(binner).connect(breathGain).connect(master);
  bsrc.start(); breathLFO.start();

  // final-hour anxiety riser: a high tone at the edge of hearing
  const riser = AC.createOscillator(); riser.type="sine"; riser.frequency.value=3200;
  riserGain = AC.createGain(); riserGain.gain.value=0;
  riser.connect(riserGain).connect(master); riser.start();

  // whisper bed: narrow band-passed noise with a wandering formant —
  // sounds like unintelligible speech just under the static
  const wsrc = AC.createBufferSource(); wsrc.buffer=buf; wsrc.loop=true;
  const wbp = AC.createBiquadFilter(); wbp.type="bandpass"; wbp.frequency.value=850; wbp.Q.value=9;
  const wlfo = AC.createOscillator(); wlfo.type="sine"; wlfo.frequency.value=2.3;
  const wlg = AC.createGain(); wlg.gain.value=420;
  wlfo.connect(wlg).connect(wbp.frequency);
  whisperGain = AC.createGain(); whisperGain.gain.value=0;
  wsrc.connect(wbp).connect(whisperGain).connect(master);
  wsrc.start(); wlfo.start();
}
function setStaticLevel(v){ if(staticGain) staticGain.gain.setTargetAtTime(v, AC.currentTime, .08); }
function setDroneLevel(v){ if(droneGain) droneGain.gain.setTargetAtTime(v, AC.currentTime, .3); }
function setWhisperLevel(v){ if(whisperGain) whisperGain.gain.setTargetAtTime(v, AC.currentTime, .4); }
function setBreathLevel(v, rate){
  if(!breathGain) return;
  breathGain.gain.setTargetAtTime(v, AC.currentTime, .8);
  if(rate!==undefined) breathLFO.frequency.setTargetAtTime(rate, AC.currentTime, 2);
}
function setRiserLevel(v){ if(riserGain) riserGain.gain.setTargetAtTime(v, AC.currentTime, 3); }
function beep(freq=1000,dur=.12,vol=.15,type="square"){
  if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g).connect(master);o.start();o.stop(AC.currentTime+dur);
}
function stinger(){ // discordant hit for scares
  if(!AC) return;
  for(const f of [66,71,199,313]){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sawtooth";o.frequency.setValueAtTime(f*2,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*.5,AC.currentTime+1.2);
    g.gain.setValueAtTime(.22,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.4);
    o.connect(g).connect(master);o.start();o.stop(AC.currentTime+1.5);
  }
  const n=AC.createBufferSource();n.buffer=staticSrc.buffer;
  const g=AC.createGain();g.gain.setValueAtTime(.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.2);
  n.connect(g).connect(master);n.start();n.stop(AC.currentTime+1.2);
}
function scream(){ // layered shriek for the death scare
  if(!AC) return;
  const t=AC.currentTime;
  const n=AC.createBufferSource(); n.buffer=staticSrc.buffer;
  const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1200;
  const g=AC.createGain(); g.gain.setValueAtTime(.4,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
  n.connect(hp).connect(g).connect(master); n.start(); n.stop(t+1.6);
  for(const f of [720,745]){
    const o=AC.createOscillator(),og=AC.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(f,t);
    o.frequency.linearRampToValueAtTime(f*2.1,t+.5);
    o.frequency.linearRampToValueAtTime(f*.8,t+1.4);
    og.gain.setValueAtTime(.12,t);
    og.gain.exponentialRampToValueAtTime(.0001,t+1.5);
    o.connect(og).connect(master);o.start();o.stop(t+1.5);
  }
}
function screech(){ // tracking slip
  if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type="sawtooth";
  o.frequency.setValueAtTime(2400,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+.15);
  g.gain.setValueAtTime(.06,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.16);
  o.connect(g).connect(master);o.start();o.stop(AC.currentTime+.17);
}
function thump(){ // one heartbeat (lub-dub)
  if(!AC) return;
  for(const [off,v] of [[0,.16],[0.16,.10]]){
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type="sine"; o.frequency.setValueAtTime(58,AC.currentTime+off);
    f.type="lowpass"; f.frequency.value=120;
    g.gain.setValueAtTime(v,AC.currentTime+off);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+off+.14);
    o.connect(f).connect(g).connect(master);
    o.start(AC.currentTime+off); o.stop(AC.currentTime+off+.15);
  }
}
function easTone(on){
  if(!AC) return;
  if(on && !easTone.o){
    const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
    o1.type="sine";o1.frequency.value=853;
    o2.type="sine";o2.frequency.value=960;
    g.gain.value=.06;
    o1.connect(g);o2.connect(g);g.connect(master);
    o1.start();o2.start();
    easTone.o=[o1,o2];
  }else if(!on && easTone.o){
    easTone.o.forEach(o=>o.stop());easTone.o=null;
  }
}
function phoneRingTone(){
  if(!AC) return;
  let t=AC.currentTime;
  for(let r=0;r<2;r++){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="square";o.frequency.value=440+r*40;
    g.gain.setValueAtTime(0,t);
    for(let k=0;k<10;k++){
      g.gain.setValueAtTime(.08,t+k*.08);
      g.gain.setValueAtTime(0,t+k*.08+.04);
    }
    o.connect(g).connect(master);o.start(t);o.stop(t+1);
  }
}
function evilRingTone(){ // too slow, too low — the tell
  if(!AC) return;
  const t=AC.currentTime;
  for(const f of [180,187]){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="square";o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    for(let k=0;k<6;k++){
      g.gain.setValueAtTime(.07,t+k*.17);
      g.gain.setValueAtTime(0,t+k*.17+.1);
    }
    o.connect(g).connect(master);o.start(t);o.stop(t+1.1);
  }
}
function silenceScare(){
  if(!AC) return;
  say("the hum just… stopped.",1.5);
  const t=AC.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setTargetAtTime(.0001,t,.08);
  setTimeout(()=>{
    if(!AC) return;
    master.gain.setTargetAtTime(.7,AC.currentTime,.02);
    stinger(); noiseBurst=1; shake=1;
    flickerEl.style.opacity=.85;
    setTimeout(()=>flickerEl.style.opacity=0,80);
    if(state===ST.PLAY) say("—it was RIGHT THERE—",2.5);
  },1700);
}
function footstep(vol=.2){
  if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type="sine"; o.frequency.setValueAtTime(44,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(28,AC.currentTime+.18);
  f.type="lowpass"; f.frequency.value=90;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.25);
  o.connect(f).connect(g).connect(master);
  o.start(); o.stop(AC.currentTime+.26);
}
function knock(){
  if(!AC) return;
  let t=AC.currentTime;
  for(let k=0;k<3;k++){
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type="triangle"; o.frequency.setValueAtTime(95,t+k*.28);
    f.type="lowpass"; f.frequency.value=300;
    g.gain.setValueAtTime(.28,t+k*.28);
    g.gain.exponentialRampToValueAtTime(.0001,t+k*.28+.12);
    o.connect(f).connect(g).connect(master);
    o.start(t+k*.28); o.stop(t+k*.28+.13);
  }
}
function advanceCue(stage){ // it moved closer — louder with each stage
  if(!AC) return;
  footstep(.12+stage*.09);
  const n=AC.createBufferSource(); n.buffer=staticSrc.buffer;
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=700; bp.Q.value=7;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,AC.currentTime);
  g.gain.linearRampToValueAtTime(.05+stage*.04,AC.currentTime+.4);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.3);
  n.connect(bp).connect(g).connect(master); n.start(); n.stop(AC.currentTime+1.4);
}
function floodBlast(){
  if(!AC) return;
  const n=AC.createBufferSource(); n.buffer=staticSrc.buffer;
  const g=AC.createGain();
  g.gain.setValueAtTime(.55,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.8);
  n.connect(g).connect(master); n.start(); n.stop(AC.currentTime+.85);
  beep(70,.6,.2,"sawtooth");
}
function metalGroan(){ // the building settles wrong
  if(!AC) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type="sawtooth";
  o.frequency.setValueAtTime(55,t);
  o.frequency.linearRampToValueAtTime(38,t+2.2);
  f.type="bandpass"; f.frequency.value=180; f.Q.value=3;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.05,t+.6);
  g.gain.exponentialRampToValueAtTime(.0001,t+2.5);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+2.6);
}
function clickCluster(){ // dry throat clicks, too close
  if(!AC) return;
  let t=AC.currentTime;
  const n=ri(3,6);
  for(let k=0;k<n;k++){
    const src=AC.createBufferSource(); src.buffer=staticSrc.buffer;
    const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=2500;
    const g=AC.createGain();
    g.gain.setValueAtTime(.10,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+.03);
    src.connect(hp).connect(g).connect(master); src.start(t); src.stop(t+.04);
    t+=rnd(.09,.15);
  }
}
function tapeFlutter(){ // the recording itself hiccups
  if(!AC) return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=staticSrc.buffer;
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2400;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t);
  for(let k=0;k<6;k++){
    g.gain.setValueAtTime(.06,t+k*.09);
    g.gain.setValueAtTime(.01,t+k*.09+.045);
  }
  g.gain.setValueAtTime(0,t+.6);
  src.connect(bp).connect(g).connect(master); src.start(t); src.stop(t+.65);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(310,t);
  o.frequency.linearRampToValueAtTime(270,t+.3);
  o.frequency.linearRampToValueAtTime(330,t+.6);
  og.gain.setValueAtTime(.02,t);
  og.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.connect(og).connect(master); o.start(t); o.stop(t+.62);
}
function whisperBurst(){ // right at your ear, once
  if(!AC||!whisperGain) return;
  whisperGain.gain.setValueAtTime(.22,AC.currentTime);
}
let ambIn=12;
function ambienceTick(dt){
  ambIn-=dt;
  if(ambIn>0) return;
  ambIn=rnd(14,34)*(1-threat*.4);
  pick([metalGroan, clickCluster, tapeFlutter, whisperBurst, ()=>footstep(.08)])();
}

/* ---------- MOSH studio intro audio ---------- */
let studioNodes=[];
function studioAudio(){
  if(!AC) return;
  const T=AC.currentTime;
  const keep=n=>{studioNodes.push(n);return n;};
  // tape hiss ramp
  const hiss=keep(AC.createBufferSource()); hiss.buffer=staticSrc.buffer; hiss.loop=true;
  const hg=AC.createGain();
  hg.gain.setValueAtTime(0,T);
  hg.gain.linearRampToValueAtTime(.05,T+.4);
  hg.gain.linearRampToValueAtTime(.012,T+1.6);
  hg.gain.linearRampToValueAtTime(0,T+9.4);
  hiss.connect(hg).connect(master); hiss.start(T); hiss.stop(T+9.6);
  // sub boom on each letter landing
  for(const lt of LAND){
    const o=keep(AC.createOscillator()),g=AC.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(130,T+lt);
    o.frequency.exponentialRampToValueAtTime(36,T+lt+.5);
    g.gain.setValueAtTime(.0001,T);
    g.gain.setValueAtTime(.5,T+lt);
    g.gain.exponentialRampToValueAtTime(.0001,T+lt+.7);
    o.connect(g).connect(master); o.start(T+lt); o.stop(T+lt+.8);
  }
  // rising fanfare — detuned saw chord swelling under the logo build
  const chord=[110,164.8,220,277.2];
  chord.forEach((f,i)=>{
    const o=keep(AC.createOscillator()),g=AC.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(f*.5,T+1.6);
    o.frequency.exponentialRampToValueAtTime(f,T+3.9);
    o.detune.setValueAtTime(i*4,T);
    o.detune.setValueAtTime(i*4,T+7.2);
    o.detune.linearRampToValueAtTime(i*4-1600,T+9.0); // corruption pitch-fall
    g.gain.setValueAtTime(0,T+1.6);
    g.gain.linearRampToValueAtTime(.045,T+4.6);
    g.gain.setValueAtTime(.045,T+7.2);
    g.gain.exponentialRampToValueAtTime(.0001,T+9.0);
    o.connect(g).connect(master); o.start(T+1.6); o.stop(T+9.2);
  });
  // choir-ish ident pad
  for(const f of [440,554.4,659.3,880]){
    const o=keep(AC.createOscillator()),g=AC.createGain();
    o.type="sine"; o.frequency.setValueAtTime(f,T+5);
    o.detune.setValueAtTime(0,T+7.2);
    o.detune.linearRampToValueAtTime(-1600,T+9.0);
    g.gain.setValueAtTime(0,T+5);
    g.gain.linearRampToValueAtTime(.02,T+5.6);
    g.gain.setValueAtTime(.02,T+7.4);
    g.gain.exponentialRampToValueAtTime(.0001,T+8.8);
    o.connect(g).connect(master); o.start(T+5); o.stop(T+9.2);
  }
}
function stopStudioAudio(){
  for(const n of studioNodes){ try{n.stop();}catch(e){} }
  studioNodes=[];
}

/* ---------- game state ---------- */
const ST = { BOOT:0, STUDIO:1, MENU:2, INTRO:3, PLAY:4, EAS:5, SCARE:6, DEAD:7, WIN:8, BLACKOUT:9 };
let state = ST.BOOT;
let stateT = 0;             // seconds in current state
let gameMin = 0;            // minutes since 12:00 AM (1 real sec = 1 game min)
const NIGHT_END = 360;      // 6:00 AM
let channel = 1;
let anomalies = {};         // ch -> {age,kind,resp,fuse,lockNeed,warned}
let strikes = 0;
// tuner minigame
let tuneOn=false, needle=.5, band=.5, bandW=.2, bandTo=.5, lock=0, invertT=0, lunged={};
// power (the FNAF resource)
let power = 100, blackT = 0;
// the entity walking the station: 0 LOT → 1 HALL → 2 DOOR → 3 BOOTH
const EPOS = ["LOT","HALL","DOOR","BOOTH"];
let entityPos = 0, entityTimer = 55, doorT = -1, doorWindow = 8;
let deathCause = "";
let threat = 0;             // 0..1, drives dread + entity closeness
let dread = 0;              // extra threat from bad choices, decays
let ch6Heat = 0, ch6WatchT = 0, ch6Total = 0;
let scareT = 0, deadT = 0, winT = 0;
let buttonsCorrupt=false;
let events = [];            // scripted night beats
let lastHour = 0;
let activeCall = -1, phoneRingT = -1;
let integrity = 100, restoredCount = 0, finalGrade = "";
let heartIn = 0, sublimT = 0;
let nextAnomalyIn = 8, nextTarget = 1;
let sub = "", subT = 0;
let noiseBurst = 0;         // visual disruption impulse
let shake = 0;
let logLines = [];

function say(text, dur=4){ sub=text; subT=dur; }
function addLog(s){ logLines.push(s); if(logLines.length>4) logLines.shift(); }
function loadLastGrade(){ try{ return localStorage.getItem("deadair_last"); }catch(e){ return null; } }
function finishGrade(alive){
  const score = integrity + power*.1; // frugality pays
  const g = !alive ? "F"
    : score>=95 ? "S" : score>=82 ? "A" : score>=66 ? "B"
    : score>=46 ? "C" : "D";
  try{ localStorage.setItem("deadair_last",g); }catch(e){}
  return g;
}

/* ---------- input ---------- */
const keys = {};
function advance(){ // shared key/click state dispatch
  if(state===ST.BOOT){ beginStudio(); return true; }
  if(state===ST.STUDIO){ if(stateT>1.5) endStudio(); return true; }
  if(state===ST.MENU){ startIntro(); return true; }
  if(state===ST.INTRO && stateT>1.5){ startNight(); return true; }
  if(state===ST.DEAD && deadT>4){ resetToMenu(); return true; }
  if(state===ST.WIN && winT>6){ resetToMenu(); return true; }
  return false;
}
window.addEventListener("keydown", e=>{
  if(e.repeat) return;
  keys[e.code]=true;
  initAudio();
  if(AC.state==="suspended") AC.resume();
  if(advance()) return;
  if(state===ST.PLAY||state===ST.EAS){
    const n = parseInt(e.key,10);
    if(n>=1&&n<=6&&state===ST.PLAY){ switchChannel(n); }
    if(e.code==="Space" && state===ST.PLAY){ toggleTuner(); e.preventDefault?.(); }
    if(e.code==="KeyF" && state===ST.PLAY){ signalFlood(); }
    if(e.code==="KeyE" && state===ST.PLAY && phoneRingT>=0){ answerPhone(); }
  }
});
window.addEventListener("keyup", e=>{ keys[e.code]=false; });
window.addEventListener("pointerdown", ()=>{
  initAudio();
  if(AC.state==="suspended") AC.resume();
  advance();
});

function switchChannel(n){
  if(n===channel) return;
  channel=n;
  ch6WatchT=0;
  tuneOn=false; lock=0; lunged={};
  noiseBurst=Math.max(noiseBurst,.9);

  setTimeout(()=>{ if(state===ST.PLAY) updateStaticBed(); },140);
}

/* ---------- flow ---------- */
function beginStudio(){ state=ST.STUDIO; stateT=0; studioAudio(); }
function endStudio(){ stopStudioAudio(); state=ST.MENU; stateT=0; noiseBurst=1; }

/* ---------- anomaly system ---------- */
function scheduleNext(hour){
  const interval = clamp(16-hour*2.2, 5, 16);
  nextAnomalyIn = interval*rnd(.75,1.25);
  nextTarget = ri(1,5); // pre-chosen so channel 6 can whisper it to you
}
function spawnAnomaly(){
  const candidates=[1,2,3,4,5].filter(c=>!anomalies[c]);
  if(!candidates.length) return;
  const ch = candidates.includes(nextTarget) ? nextTarget : pick(candidates);
  const hour = gameMin/60;
  let resp="track", kind=pick(["figure","face","text","invert"]);
  let fuse=32, lockNeed=1.8, age=0;
  const roll=Math.random();
  if(hour>0.8 && roll<0.22){ resp="stare"; kind="stare"; fuse=26; age=7; }
  else if(hour>1.6 && roll<0.40){ kind="surge"; fuse=10; lockNeed=1.0; }
  anomalies[ch]={age,kind,resp,fuse,lockNeed,warned:false};
  if(resp==="stare"){
    beep(160,.5,.06,"sine");
    say("something is watching from CH "+ch+". do not meet its eye.",4);
    addLog(fmtClock()+" OBSERVER CH-"+ch);
  } else if(kind==="surge"){
    beep(880,.15,.1,"sawtooth"); beep(880,.15,.1,"sawtooth");
    say("SURGE ON CH "+ch+" — SECONDS TO ACT.",3);
    addLog(fmtClock()+" SURGE CH-"+ch);
  } else {
    beep(300,.3,.05,"sine");
    addLog(fmtClock()+" ANOMALY CH-"+ch);
  }
}
function failAnomaly(ch){
  delete anomalies[ch];
  strikes++;
  integrity=clamp(integrity-12,0,100);
  noiseBurst=1; shake=1;
  stinger();
  addLog(fmtClock()+" CONTAINMENT FAILURE ("+strikes+"/3)");
  say(strikes<3 ? "IT MOVED CLOSER." : "", 3);
  if(strikes>=3){ triggerScare("THREE FAILURES — IT FOUND THE BOOTH"); return true; }
  return false;
}
function anomalyTick(dt){
  const hour = gameMin/60;
  nextAnomalyIn -= dt;
  if(nextAnomalyIn<=0){ spawnAnomaly(); scheduleNext(hour); }

  for(const chS of Object.keys(anomalies)){
    const ch=+chS, a=anomalies[ch];
    if(a.resp==="stare"){
      // it feeds on attention: grows while watched, starves while ignored
      if(channel===ch) a.age += dt*2.6;
      else a.age -= dt*.85;
      if(a.age<=0){
        delete anomalies[ch];
        integrity=clamp(integrity+1,0,100);
        addLog(fmtClock()+" CH-"+ch+" SETTLED");
        say("it lost interest in channel "+ch+".",2.5);
        updateStaticBed();
        continue;
      }
    } else {
      a.age += dt;
    }
    if(!a.warned && a.age > a.fuse*.68){
      a.warned=true;
      say(a.kind==="surge" ? "SURGE CRITICAL — CH "+ch : "SIGNAL DEGRADATION CRITICAL — CH "+ch, 3);
      beep(220,.5,.1,"sawtooth");
    }
    if(a.age>a.fuse){ if(failAnomaly(ch)) return; }
  }

  const anomCount=Object.keys(anomalies).length;
  integrity = clamp(integrity - dt*.12*anomCount, 0, 100);
  dread = Math.max(0, dread - dt*.004);
  ch6Heat = Math.max(0, ch6Heat - dt*.004);
  threat = clamp(hour/6*.42 + strikes*.18 + anomCount*.06 + ch6Heat + dread, 0, 1);
  setDroneLevel(threat*.13);
  if(humGain) humGain.gain.setTargetAtTime(.012+threat*.02, AC.currentTime, 1);
  // something large breathing, closer and slower as the night rots
  setBreathLevel(threat>.35 ? (threat-.35)*.12 : 0, .28-threat*.08);
  // final-hour riser at the edge of hearing
  setRiserLevel(hour>5 ? (hour-5)*.007 : 0);

  // heartbeat under high threat
  if(threat>.55){
    heartIn -= dt;
    if(heartIn<=0){ thump(); heartIn = lerp(1.1,.55, clamp((threat-.55)/.45,0,1)); }
  }

  // subliminal single-frame flashes when it's close
  if(threat>.5 && sublimT<=0 && Math.random()<dt*.012){
    sublimT=.08;
    flickerEl.style.opacity=.5;
    setTimeout(()=>flickerEl.style.opacity=0,60);
  }

  // channel 6: rising heat and the intel trade (whisper level set in entityTick)
  if(channel===6){
    ch6WatchT += dt; ch6Total += dt;
    ch6Heat = Math.min(.2, ch6Heat + dt*.012);
  } else {
    ch6WatchT=0;
  }

  tuneTick(dt);
  if(!tuneOn) updateStaticBed();
}

/* ---------- tuner minigame ---------- */
function toggleTuner(){
  const a=anomalies[channel];
  if(tuneOn){ tuneOn=false; lock=0; updateStaticBed(); return; }
  if(!a || a.resp!=="track") return;
  tuneOn=true; lock=0; lunged={};
  needle=rnd(.15,.85);
  band=rnd(.2,.8); bandTo=band;
  bandW = a.kind==="surge" ? .26 : .20;
  beep(1400,.06,.08);
}
function tuneTick(dt){
  const a=anomalies[channel];
  if(tuneOn && (!a || a.resp!=="track")){ tuneOn=false; lock=0; }
  if(!tuneOn || state!==ST.PLAY) return;
  const hour=gameMin/60;
  setStaticLevel(.22);
  power=Math.max(0,power-dt*1.0); // tuning is expensive

  // direct slider: hold ◄ ► and the needle goes there; light wobble + rare nudges
  const now=performance.now()/1000;
  const drift=Math.sin(now*1.7)*.22+Math.sin(now*3.1+1.3)*.14;
  const joltAmt=(a.kind==="surge"? .10 : .06);
  if(Math.random()<dt*(a.kind==="surge"?1.1:.5)) needle += rnd(-joltAmt,joltAmt);
  // input inversion windows after 4 AM
  if(hour>4 && invertT<=0 && Math.random()<dt*.12) invertT=rnd(.4,.6);
  invertT=Math.max(0,invertT-dt);
  const dir=((keys["ArrowLeft"]||keys["KeyA"])?-1:0)+((keys["ArrowRight"]||keys["KeyD"])?1:0);
  needle = clamp(needle + dir*(invertT>0?-1:1)*dt*.55 + drift*dt*.25, 0, 1);
  if(Math.random()<dt*.3) bandTo=clamp(band+rnd(-.3,.3),.12,.88);
  band += clamp(bandTo-band,-dt*.15,dt*.15);

  const inBand = Math.abs(needle-band) < bandW/2;
  if(inBand){
    lock += dt/a.lockNeed;
    // it lunges at you as the lock closes — fear during the fix
    for(const th of [.5,.85]){
      if(lock>th && !lunged[th]){ lunged[th]=true; beep(140,.25,.14,"sawtooth"); shake=Math.max(shake,.5); noiseBurst=Math.max(noiseBurst,.6); }
    }
  } else {
    if(lock>0 && Math.random()<dt*3) screech();
    lock = Math.max(0, lock - dt*.3);
  }
  if(lock>=1){
    delete anomalies[channel];
    tuneOn=false; lock=0; noiseBurst=.8;
    restoredCount++;
    integrity=clamp(integrity+2,0,100);
    beep(1600,.1,.1); beep(2100,.12,.1);
    addLog(fmtClock()+" CH-"+channel+" RESTORED");
    say("Signal restored.",2);
    updateStaticBed();
  }
}

/* ---------- the entity walks the station ---------- */
function entityAggro(){ // interval scale: night hour + strikes
  const hour=gameMin/60;
  const base=lerp(1,.45,clamp(hour/5,0,1));
  return base*Math.pow(.8,strikes);
}
function entityTick(dt){
  if(entityPos<2){
    entityTimer -= dt;
    if(entityTimer<=0){
      entityPos++;
      entityTimer = rnd(45,70)*entityAggro();
      advanceCue(entityPos);
      noiseBurst=Math.max(noiseBurst,.3);
      if(entityPos===1) say("something crossed the lot.",3);
      if(entityPos===2){
        doorT=0;
        doorWindow = gameMin/60>3 ? rnd(5,7) : rnd(8,10);
        knock();
        say("IT IS AT THE BOOTH DOOR — FLOOD THE SIGNAL (F)",5);
        addLog(fmtClock()+" DOOR CONTACT");
      }
    }
  } else if(entityPos===2){
    doorT += dt;
    if(doorT%2.2<dt) knock();
    if(doorT>doorWindow){ triggerScare("IT CAME THROUGH THE DOOR"); }
  }
  setWhisperLevel(Math.max(whisperTarget(), entityPos===2?.12:entityPos===1?.05:0));
}
function whisperTarget(){
  return channel===6 ? clamp(ch6WatchT/5,0,1)*.14 : (threat>.8?.03:0);
}
function signalFlood(){
  if(power<10){ say("not enough power to flood.",2.5); beep(120,.3,.08); return; }
  power-=10;
  floodBlast(); noiseBurst=1; shake=.7;
  if(entityPos>=1){
    const back=ri(1,2);
    entityPos=Math.max(0,entityPos-back);
    doorT=-1;
    entityTimer=rnd(45,70)*entityAggro();
    say("the flood drove it back to the "+EPOS[entityPos]+".",3.5);
    addLog(fmtClock()+" SIGNAL FLOOD — REPELLED");
  } else {
    say("the flood hit an empty lot. wasted power.",3.5);
    addLog(fmtClock()+" SIGNAL FLOOD — NO CONTACT");
  }
}

/* ---------- power ---------- */
function powerTick(dt){
  power=Math.max(0,power-dt*.24);
  // the board browns out as power falls
  const dim = power>40 ? 1 : lerp(.55,1,clamp(power/40,0,1));
  if(master && state===ST.PLAY) master.gain.setTargetAtTime(.7*dim, AC.currentTime, .5);
  if(power<=0 && state===ST.PLAY){
    if(gameMin>=348){ // dawn saves you at the door of 6 AM
      integrity=Math.min(integrity,60); // grade capped ~C
      finalGrade=finishGrade(true);
      state=ST.WIN; winT=0;
      easTone(false); setDroneLevel(0); setWhisperLevel(0); setStaticLevel(.02);
      say("the board died at dawn. close.",4);
      return;
    }
    state=ST.BLACKOUT; blackT=0;
    easTone(false); setStaticLevel(0); setDroneLevel(.06); setWhisperLevel(.08);
    tuneOn=false; phoneRingT=-1;
    addLog(fmtClock()+" POWER FAILURE");
  }
}

/* ---------- drawing helpers ---------- */
function drawStatic(alpha=1, coarse=3){
  const img=cx.createImageData(W,H);
  const d=img.data;
  for(let y=0;y<H;y+=coarse){
    for(let x=0;x<W;x+=coarse){
      const v=Math.random()*255|0;
      for(let dy=0;dy<coarse&&y+dy<H;dy++)for(let dx=0;dx<coarse&&x+dx<W;dx++){
        const i=((y+dy)*W+(x+dx))*4;
        d[i]=d[i+1]=d[i+2]=v; d[i+3]=255*alpha;
      }
    }
  }
  cx.putImageData(img,0,0);
}
function text(t,x,y,size=20,color="#cfc",align="left",font="bold "){
  cx.font=font+size+"px 'Courier New',monospace";
  cx.fillStyle=color;cx.textAlign=align;cx.textBaseline="top";
  cx.fillText(t,x,y);
}
function fmtClock(){
  const m=Math.floor(gameMin);
  let h=Math.floor(m/60); const mm=(m%60).toString().padStart(2,"0");
  const disp=(h===0?12:h);
  return (disp+":"+mm+" AM");
}
function corruptStr(s){
  if(threat<.7) return s;
  const p=(threat-.7)*.25;
  let out="";
  for(const c of s) out += (c!=="\n" && Math.random()<p) ? pick(["█","▓","▒","?","§","Ø"]) : c;
  return out;
}
function trackingLines(strength){
  // horizontal VHS tracking tear bands
  const n = 1+Math.floor(strength*4);
  for(let i=0;i<n;i++){
    const y=ri(0,H-14), hgt=ri(3,12), off=ri(-30,30)*strength;
    const band=cx.getImageData(0,y,W,hgt);
    cx.putImageData(band,off,y);
    cx.fillStyle="rgba(255,255,255,"+(0.04+strength*.08)+")";
    cx.fillRect(0,y,W,1);
  }
}

/* ---------- the monsters ---------- */
function drawFigure(x, y, scale, dark=.92, facing=1){
  // the Tall One: unnaturally still, then it twitches sideways.
  const now=performance.now();
  const q=Math.floor(now/430);
  const h1=Math.abs(Math.sin(q*127.3)*43758.5)%1;
  const tw = h1<.14 ? (h1*140-10) : 0;
  const breathe=1+Math.sin(now/1700)*.015;
  const tilt=(.14+threat*.4)*(x<W/2?1:-1);
  cx.save();
  cx.translate(x+tw,y); cx.scale(scale*breathe,scale);
  cx.fillStyle="rgba(3,3,3,"+dark+")";
  cx.strokeStyle="rgba(3,3,3,"+dark+")";
  // emaciated torso and stilt legs
  cx.beginPath();
  cx.moveTo(-11,-78); cx.lineTo(11,-78);
  cx.lineTo(15,10); cx.lineTo(7,160); cx.lineTo(3,160);
  cx.lineTo(0,26); cx.lineTo(-3,160); cx.lineTo(-7,160);
  cx.lineTo(-15,10); cx.closePath(); cx.fill();
  // head, tilted at a wrong angle that worsens with threat
  cx.save();
  cx.translate(0,-92); cx.rotate(tilt);
  cx.beginPath(); cx.ellipse(0,-8,11,17,0,0,7); cx.fill();
  if(facing>0){
    // pinprick eyes tracking toward the center of your screen
    const look=clamp((W/2-x)/W,-1,1)*4;
    const blink=Math.sin(now/1400+x*.13)>.93;
    if(!blink){

}
function drawCrawler(x, y, scale=1){

  const step=Math.floor(performance.now()/130);
  const s2=n=>{const v=Math.sin(step*127.1+n*311.7)*43758.5; return v-Math.floor(v);};
  cx.save();
  cx.translate(x, y+(s2(9)*4-2)); cx.scale(scale,scale);
  cx.fillStyle="rgba(5,5,5,.9)"; cx.strokeStyle="rgba(5,5,5,.9)";
  cx.beginPath(); cx.ellipse(0,-26,34,14,(s2(1)-.5)*.3,0,7); cx.fill();
  cx.beginPath(); cx.ellipse(26,-10,10,12,0,0,7); cx.fill(); // head hangs low
  cx.lineWidth=4; cx.lineCap="round";
  for(let i=0;i<4;i++){

function drawWatcher(x, y, n, sev){

    const ox=Math.sin(i*73.7)*60*(1+i*.2), oy=Math.cos(i*39.2)*34;

function drawCableWall(alpha=1, seedBase=0){
  // a wall of tangled dark cables, writhing almost imperceptibly
  const now=performance.now()/1000;
  cx.save(); cx.globalAlpha=alpha;
  cx.fillStyle="#040404"; cx.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){
    const s=seedBase+i;
    const y0=hash(s)*H*1.4-H*.2;
    const c1x=W*.25+hash(s+9)*200-100, c1y=hash(s+17)*H;
    const c2x=W*.6+hash(s+31)*220-110, c2y=hash(s+43)*H;
    const y1=hash(s+57)*H*1.4-H*.2;
    const wob=Math.sin(now*.3+s)*6;
    const thick=2+hash(s+71)*7;
    const shade=14+Math.floor(hash(s+83)*40);
    cx.strokeStyle="rgb("+shade+","+shade+","+(shade+2)+")";
    cx.lineWidth=thick; cx.lineCap="round";
    cx.beginPath(); cx.moveTo(-40,y0);
    cx.bezierCurveTo(c1x,c1y+wob,c2x,c2y-wob,W+40,y1);
    cx.stroke();
    if(i%3===0){ // dull sheen along a few strands
      cx.strokeStyle="rgba(120,120,128,.10)"; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(-40,y0-thick*.35);
      cx.bezierCurveTo(c1x,c1y+wob-thick*.35,c2x,c2y-wob-thick*.35,W+40,y1-thick*.35);
      cx.stroke();
    }
  }
  cx.restore();
}
function drawCracks(x,y,r,n,seed){
  for(let c=0;c<n;c++){
    cx.strokeStyle="rgba(30,24,18,"+(.45+hash(seed+c*5)*.3)+")";
    cx.lineWidth=.8+hash(seed+c*3.3)*1.4;
    let a=hash(seed+c*7)*6.28, px=x+Math.cos(a)*r*.2, py=y+Math.sin(a)*r*.2;
    cx.beginPath(); cx.moveTo(px,py);
    for(let k=0;k<5;k++){
      a+=(hash(seed+c*11+k)-.5)*1.4;
      px+=Math.cos(a)*r*.22; py+=Math.sin(a)*r*.22;
      cx.lineTo(px,py);
    }
    cx.stroke();
  }
}
function throatCables(x,y,scale){
  // ribbed cables descending from the jaw like a mechanical throat
  for(let i=0;i<7;i++){
    const s=i*13.7;
    const ox=(i-3)*10*scale;
    const sw=Math.sin(performance.now()/1400+i)*4;
    const sh=14+Math.floor(hash(s)*18);
    cx.strokeStyle="rgb("+sh+","+sh+","+(sh+3)+")";
    cx.lineWidth=(3.5+hash(s+5)*4)*scale; cx.lineCap="round";
    cx.beginPath(); cx.moveTo(x+ox,y);
    cx.quadraticCurveTo(x+ox+sw, y+90*scale, x+ox+sw*2, y+260*scale);
    cx.stroke();
    cx.strokeStyle="rgba(0,0,0,.55)"; cx.lineWidth=1;
    for(let r2=1;r2<9;r2++){
      const ry=y+r2*26*scale+hash(s+r2)*8*scale;
      cx.beginPath(); cx.moveTo(x+ox-4*scale,ry); cx.lineTo(x+ox+4*scale,ry); cx.stroke();
    }
  }
}
function drawMask(mx,my,scale,rage=0){
  // the entity's true face: a cracked bone mask, carved and bleeding
  const now=performance.now();
  const tw=(hash(Math.floor(now/460))<.12 ? rnd(-3,3)*(.4+rage) : 0);
  cx.save();
  cx.translate(mx+Math.sin(now/1900)*2+tw, my+Math.sin(now/2300)*1.5);
  cx.scale(scale,scale);
  throatCables(0,95,1);
  // bone with radial shading
  const g=cx.createRadialGradient(-20,-40,10,0,0,150);
  g.addColorStop(0,"#e6ddcc"); g.addColorStop(.55,"#cfc4ad");
  g.addColorStop(.8,"#8d8471"); g.addColorStop(1,"#453f33");
  cx.fillStyle=g;
  cx.beginPath(); cx.ellipse(0,-10,95,130,0,0,7); cx.fill();
  // sunken temples and cheeks
  cx.fillStyle="rgba(58,50,38,.5)";
  cx.beginPath(); cx.ellipse(-58,-8,26,60,.3,0,7); cx.fill();
  cx.beginPath(); cx.ellipse(58,-8,26,60,-.3,0,7); cx.fill();
  cx.fillStyle="rgba(70,62,48,.5)";
  cx.beginPath(); cx.ellipse(0,50,26,20,0,0,7); cx.fill();
  // hollow sockets with drifting embers and bleed-stains
  for(const s of [-1,1]){
    cx.fillStyle="#000";
    cx.beginPath(); cx.ellipse(s*40,-38,27,32,s*.12,0,7); cx.fill();
    const ex=s*40+Math.sin(now/900+s)*4, ey=-36+Math.cos(now/1100)*3;
    const flick=.5+.5*Math.sin(now/140+s*3);
    const eg=cx.createRadialGradient(ex,ey,0,ex,ey,9);
    eg.addColorStop(0,"rgba(255,"+Math.floor(60+rage*70)+",30,"+((.5+rage*.5)*(.6+.4*flick)).toFixed(3)+")");
    eg.addColorStop(1,"rgba(120,10,5,0)");
    cx.fillStyle=eg;
    cx.beginPath(); cx.arc(ex,ey,9,0,7); cx.fill();
    cx.strokeStyle="rgba(110,14,14,.6)"; cx.lineCap="round";
    for(let b=0;b<3;b++){
      cx.lineWidth=1.2+hash(s*9+b)*1.6;
      const bx=s*(26+b*6);
      cx.beginPath(); cx.moveTo(bx,-16);
      cx.quadraticCurveTo(bx+hash(b+s)*4-2, 20, bx+hash(b*3+s)*8-4, 44+hash(b*7)*30+rage*20);
      cx.stroke();
    }
  }
  // sunken nose
  cx.fillStyle="#1c1812";
  cx.beginPath(); cx.moveTo(-8,22); cx.lineTo(8,22); cx.lineTo(0,-2); cx.closePath(); cx.fill();
  // hairline cracks, widening with rage
  drawCracks(0,-70,120,6+Math.floor(rage*4),3.3);
  drawCracks(-40,-10,90,4,17.9);
  drawCracks(44,6,80,4,29.4);
  // carved sigil rows across brow and cheekbones
  cx.strokeStyle="rgba(52,44,34,.8)"; cx.lineWidth=1.1;
  for(let row=0;row<4;row++){
    const ry=[-86,-6,6,18][row];
    const rx0=row===0?-42:(row%2?-68:26);
    const cnt=row===0?12:7;
    for(let gp=0;gp<cnt;gp++){
      const gx=rx0+gp*7, gy=ry+hash(row*31+gp)*4;
      for(let st=0;st<3;st++){
        cx.beginPath();
        cx.moveTo(gx+hash(row+gp+st)*4-2, gy+hash(gp*3+st)*5-2);
        cx.lineTo(gx+hash(row*7+gp+st+9)*5-2, gy+3+hash(st+gp)*4);
        cx.stroke();
      }
    }
  }
  // broken mouth: a jagged black gap with chipped edges
  cx.fillStyle="#050302";
  cx.beginPath();
  cx.moveTo(-46,78);
  for(let k=0;k<=8;k++) cx.lineTo(-46+k*11.5, 78+hash(k*7)*10-5);
  cx.lineTo(46,102+rage*8);
  for(let k=8;k>=0;k--) cx.lineTo(-46+k*11.5, 102+hash(k*13)*12-6+rage*8);
  cx.closePath(); cx.fill();
  cx.fillStyle="#b9ae97";
  for(let k=0;k<7;k++){
    const x=-40+k*13+hash(k*5)*4;
    cx.beginPath(); cx.moveTo(x,80); cx.lineTo(x+7,80); cx.lineTo(x+3,88+hash(k)*7);
    cx.closePath(); cx.fill();
  }
  cx.restore();
}
function drawScareFace(t){

/* ---------- MOSH studio intro ---------- */
const STUDIO_LEN=9.6;
const MOSH="MOSH";
const LAND=[1.9,2.55,3.2,3.85]; // letter landing times
function chromeGrad(y0,y1,decay){
  const g=cx.createLinearGradient(0,y0,0,y1);
  if(decay<.5){
    g.addColorStop(0,"#eaf6ff"); g.addColorStop(.35,"#8fc1e8");
    g.addColorStop(.49,"#fdfdfd"); g.addColorStop(.52,"#1a2733");
    g.addColorStop(.62,"#3e576d"); g.addColorStop(.8,"#cfe6f8");
    g.addColorStop(1,"#f8fcff");
  } else {
    g.addColorStop(0,"#d8ffd8"); g.addColorStop(.4,"#57a06a");
    g.addColorStop(.5,"#050d06"); g.addColorStop(.6,"#2e5c3a");
    g.addColorStop(1,"#9fdca8");
  }
  return g;
}
function drawMoshLogo(t,corrupt){
  const y=H*.40, fontSz=150;
  cx.font="900 "+fontSz+"px 'Arial Black',Arial,sans-serif";
  const gap=14;
  const widths=[...MOSH].map(ch=>cx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+gap*(MOSH.length-1);
  let lx=W/2-total/2;
  for(let i=0;i<MOSH.length;i++){
    const landT=LAND[i], cxr=lx+widths[i]/2;
    lx+=widths[i]+gap;
    if(t<landT-.55) continue;
    const p=clamp((t-(landT-.55))/.55,0,1);
    // ghost trail while flying in, then the letter itself
    for(let k=3;k>=0;k--){
      const gp=clamp(p-k*.09,0,1);
      if(gp<=0) continue;
      const ease=1-Math.pow(1-gp,3);
      const scl=6-5*ease;
      cx.save();
      const jx = corrupt>0 ? rnd(-14,14)*corrupt : 0;
      const jy = corrupt>0 ? corrupt*corrupt*rnd(0,40) : 0;
      cx.translate(cxr+jx, y+jy);
      cx.scale(scl,scl);
      cx.rotate((1-ease)*.4*(i%2?1:-1));
      cx.globalAlpha=(k===0?1:.13)*gp;
      cx.font="900 "+fontSz+"px 'Arial Black',Arial,sans-serif";
      cx.textAlign="center"; cx.textBaseline="middle";
      if(k===0){
        if(t>5 && t<7.2){ // ident glow pulse
          cx.shadowColor="rgba(255,220,120,.8)";
          cx.shadowBlur=18+Math.sin(t*4)*10;
        }
        if(corrupt>0){ // chromatic aberration split
          const off=4+corrupt*14;
          cx.globalCompositeOperation="lighter";
          cx.fillStyle="rgba(255,0,60,.5)"; cx.fillText(MOSH[i],-off,0);
          cx.fillStyle="rgba(0,90,255,.5)"; cx.fillText(MOSH[i],off,0);
          cx.globalCompositeOperation="source-over";
        }
        cx.fillStyle=chromeGrad(-fontSz/2,fontSz/2,corrupt);
        cx.fillText(MOSH[i],0,0);
        cx.shadowBlur=0;
        cx.lineWidth=2.5;
        cx.strokeStyle="rgba(255,255,255,"+(0.35*(1-corrupt))+")";
        cx.strokeText(MOSH[i],0,0);
      } else {
        cx.fillStyle="rgba(160,200,255,.5)";
        cx.fillText(MOSH[i],0,0);
      }
      cx.restore();
    }
    // landing shockwave ring
    const ra=t-landT;
    if(ra>0 && ra<.5){
      cx.save();
      cx.globalAlpha=(1-ra*2)*.6;
      cx.strokeStyle="#cfe6ff"; cx.lineWidth=3;
      cx.beginPath(); cx.arc(cxr,y,ra*300,0,7); cx.stroke();
      cx.restore();
    }
  }
  cx.globalAlpha=1;
}
function drawStudio(t){
  cx.fillStyle="#000"; cx.fillRect(0,0,W,H);
  if(t<1.5){ // phase 1 — the tape loads
    if(Math.random()<.3) trackingLines(.5);
    text("PLAY ▶",34,30,20,"#ddd");
    text("SP 0:00:0"+Math.floor(t*2),34,60,16,"#9c9");
    if(t>.8&&t<1.35){
      cx.fillStyle="#000a4a"; cx.fillRect(W/2-180,H/2-50,360,100);
      text("MOSH VIDEO",W/2,H/2-28,34,"#fff","center");
      text("HI-FI STEREO",W/2,H/2+16,14,"#9ab","center");
    }
    drawGrain(.08);
    return;
  }
  const corrupt=clamp((t-7.2)/2.0,0,1);
  // backdrop glow
  const bg=cx.createRadialGradient(W/2,H*.42,20,W/2,H*.42,430);
  if(corrupt<.5){
    bg.addColorStop(0,"#1c2a4a"); bg.addColorStop(.6,"#0a1022"); bg.addColorStop(1,"#020308");
  } else {
    bg.addColorStop(0,"#12291a"); bg.addColorStop(.6,"#06120a"); bg.addColorStop(1,"#010302");
  }
  cx.fillStyle=bg; cx.fillRect(0,0,W,H);
  // rotating sunrays
  const rayA=clamp(t-1.5,0,1)*.10*(1-corrupt);
  if(rayA>0){
    cx.save();
    cx.translate(W/2,H*.42); cx.rotate(t*.15);
    for(let i=0;i<24;i++){
      cx.rotate(Math.PI/12);
      if(i%2) continue;
      cx.fillStyle="rgba(140,110,50,"+rayA+")";
      cx.beginPath(); cx.moveTo(0,0); cx.arc(0,0,520,0,Math.PI/12); cx.closePath(); cx.fill();
    }
    cx.restore();
  }
  // orbiting sparkles
  if(t>1.8){
    for(let i=0;i<36;i++){
      const a0=i*1.71+t*(.3+(i%5)*.06), r=150+((i*53)%180);
      const sx=W/2+Math.cos(a0)*r*1.25, sy=H*.42+Math.sin(a0)*r*.55;
      const twk=Math.max(0,Math.sin(t*3+i*2.7));
      cx.globalAlpha=twk*.7*(1-corrupt)*clamp(t-1.8,0,1);
      cx.strokeStyle="#fff"; cx.lineWidth=1.4;
      const l=3+twk*5;
      cx.beginPath(); cx.moveTo(sx-l,sy); cx.lineTo(sx+l,sy);
      cx.moveTo(sx,sy-l); cx.lineTo(sx,sy+l); cx.stroke();
    }
    cx.globalAlpha=1;
  }
  drawMoshLogo(t,corrupt);
  // lens-flare sweep across the letters
  if(t>4.2&&t<5.05){
    const p=(t-4.2)/.85, sx=lerp(-80,W+80,p);
    cx.save();
    cx.globalCompositeOperation="lighter";
    const fg=cx.createRadialGradient(sx,H*.40,0,sx,H*.40,120);
    fg.addColorStop(0,"rgba(255,255,255,.85)");
    fg.addColorStop(.3,"rgba(255,240,200,.3)");
    fg.addColorStop(1,"rgba(255,255,255,0)");
    cx.fillStyle=fg; cx.fillRect(sx-120,H*.40-120,240,240);
    cx.fillStyle="rgba(255,255,255,.25)"; cx.fillRect(0,H*.40-2,W,4);
    cx.restore();
  }
  // phase 3 — ident text
  if(t>5){
    const a=clamp((t-5)/.8,0,1)*(1-corrupt);
    cx.globalAlpha=a;
    text("M O S H   P R O D U C T I O N   S T U D I O", W/2, H*.62, 22, "#e8d9a8","center");
    cx.globalAlpha=a*(.6+Math.sin(t*2.2)*.4);
    text("· P R E S E N T S ·", W/2, H*.70, 15, "#b8a878","center");
    cx.globalAlpha=1;
  }
  // phase 4 — the logo fails
  if(corrupt>0){
    for(let i=0;i<20;i++){ // vertical melt slices
      const sx=ri(0,W-20), w=ri(4,20);
      cx.drawImage(cv, sx,0,w,H, sx,rnd(0,60)*corrupt,w,H);
    }
    trackingLines(corrupt);
    if(t>8.45&&t<8.6) drawScareFace(.25); // two-frame subliminal
    if(t>8.8) drawStatic(clamp((t-8.8)*1.6,0,1),3);
  }
  drawGrain(.04);
}

    cx.strokeStyle="rgba(160,40,40,.5)"; cx.lineWidth=1.5;
    for(let i=0;i<8;i++){
      cx.beginPath();
      cx.moveTo((i%2?-1:1)*wdt, rnd(-hgt*.4,hgt*.4));
      cx.quadraticCurveTo(rnd(-80,80),rnd(-20,20), rnd(-60,60),rnd(-10,10));
      cx.stroke();
    }
    cx.fillStyle="#3a3320";
    cx.beginPath(); cx.arc(0,0,Math.min(hgt*.85,74),0,7); cx.fill();
    cx.fillStyle="#000";
    cx.beginPath(); cx.arc(0,0,Math.min(hgt*.5,40)*(0.7+Math.sin(performance.now()/900)*.1),0,7); cx.fill();
    cx.fillStyle="#fff"; cx.fillRect(-hgt*.2,-hgt*.25,4,4);
    cx.restore();
    if(Math.floor(performance.now()/400)%2===0)
      text("IT SEES YOU — LOOK AWAY", W/2, 60, 24, "#f44","center");
    trackingLines(.15+sev*.5);
    return;
  }
  if(a.kind==="surge"){
    trackingLines(.8+sev*.5);
    if(Math.random()<.5) drawStatic(.35,3);
    const pulse=.4+Math.abs(Math.sin(performance.now()/120))*.5;
    cx.strokeStyle="rgba(255,40,40,"+pulse+")"; cx.lineWidth=10;

  if(a.kind==="invert"){
    cx.save(); cx.globalCompositeOperation="difference";
    cx.fillStyle="rgba(255,255,255,"+(.25+sev*.6)+")"; cx.fillRect(0,0,W,H);

    cx.save(); cx.globalAlpha=.12+sev*.55;

  if(Math.random()<sev*.4) drawStatic(.2,4);

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const tNow=now/1000;
  stateT+=dt;
  if(subT>0){ subT-=dt; if(subT<=0) sub=""; }
  noiseBurst=Math.max(0,noiseBurst-dt*2.2);
  shake=Math.max(0,shake-dt*1.8);
  sublimT=Math.max(0,sublimT-dt);

  cx.save();
  if(shake>0) cx.translate(rnd(-8,8)*shake, rnd(-6,6)*shake);

  switch(state){
    case ST.BOOT: drawBoot(tNow); break;
    case ST.STUDIO:
      drawStudio(stateT);
      if(stateT>STUDIO_LEN) endStudio();
      break;
    case ST.MENU: drawMenu(tNow); break;
    case ST.INTRO: drawIntro(stateT); break;
    case ST.EAS:
      gameMin+=dt; drawEAS(stateT);
      if(stateT>13){ state=ST.PLAY; easTone(false); say("…resuming normal programming.",3); }
      break;
    case ST.PLAY:
      gameMin+=dt;
      anomalyTick(dt);
      if(state!==ST.PLAY) break; // a strike may have triggered the scare
      entityTick(dt);
      if(state!==ST.PLAY) break; // the door may have given way
      powerTick(dt);
      if(state!==ST.PLAY) break; // the board may have died
      scriptTick();
      if(state!==ST.PLAY) break;
      ambienceTick(dt);
      drawPlayChannel(tNow);
      if(tuneOn) drawTuner();
      // the phone, if it's ringing
      if(phoneRingT>=0){
        const evil=CALLS[activeCall].evil;
        phoneRingT+=dt;
        if(phoneRingT%2<dt) (evil?evilRingTone():phoneRingTone());
        const label = evil ? "☎ L̸INE 1  —  press E" : "☎ LINE 1  —  press E";
        text(label, W/2, 40, 22,
          (Math.floor(tNow*2)%2) ? (evil?"#f66":"#ff6") : "#a84", "center");
        if(phoneRingT>14) missCall();
      }
      // subliminal flash frame
      if(sublimT>0) drawScareFace(.2);
      break;
    case ST.SCARE:
      scareT+=dt;
      if(scareT<.35){
        // the door-burst: it snaps up from the bottom of the frame
        cx.fillStyle="#000"; cx.fillRect(0,0,W,H);
        const up=scareT/.35;
        drawFigure(W/2+rnd(-10,10), H+140-up*260, 2.4, .95);
        shake=1;
      } else drawScareFace(scareT-.35);
      if(scareT>2.9){ state=ST.DEAD; deadT=0; setStaticLevel(.02); setDroneLevel(0); }
      break;
    case ST.BLACKOUT: {
      blackT+=dt; gameMin+=dt;
      cx.fillStyle="#000"; cx.fillRect(0,0,W,H);
      // dawn can still save you if it was close
      if(gameMin>=NIGHT_END){
        integrity=Math.min(integrity,60);
        finalGrade=finishGrade(true);
        state=ST.WIN; winT=0; setDroneLevel(0); setWhisperLevel(0);
        break;
      }
      if(blackT<1) { /* pure dark, pure silence */ }
      if(blackT>1 && blackT%1.4<dt) footstep(.14+blackT*.03);
      // two eyes fade in from the dark
      if(blackT>3){
        const a=clamp((blackT-3)/5,0,1);
        const eb=Math.sin(performance.now()/1500)>.95?0:1;
        cx.fillStyle="rgba(225,238,215,"+(a*.85*eb)+")";
        const drift=(blackT-3)*6;
        cx.fillRect(W/2-14,H*.42-drift*.4,5,5);
        cx.fillRect(W/2+9,H*.42-drift*.4,5,5);
      }
      if(blackT>2 && Math.floor(blackT*1.2)%3===0)
        text("POWER FAILURE", W/2, H*.14, 22, "rgba(255,60,40,.5)","center");
      if(blackT>8.5) triggerScare("THE POWER RAN OUT");
      break;
    }
    case ST.DEAD: deadT+=dt; drawDead(deadT); break;
    case ST.WIN: winT+=dt; drawWin(winT); break;
  }

  // channel-change / disruption noise
  if(noiseBurst>0 && state!==ST.SCARE){ drawStatic(noiseBurst*.85,3); trackingLines(noiseBurst); }
  cx.restore();

  // OSD text
  if(state===ST.PLAY||state===ST.EAS){
    const anomCount=Object.keys(anomalies).length;
    osd.textContent=corruptStr(
      "CH "+(state===ST.EAS?"—":channel)+"  SIG "+Math.round(integrity)+"%"
      +(anomCount? "\nINTRUSION×"+anomCount : "")
      +(strikes? "\nFAIL "+strikes+"/3":""));
    osdclock.textContent=corruptStr(fmtClock());
  } else { osd.textContent=""; osdclock.textContent=""; }
  subEl.textContent=sub;
  let trackMsg="";
  if(state===ST.PLAY){
    const a=anomalies[channel];
    if(entityPos===2 && !tuneOn) trackMsg="⚠ IT IS AT THE DOOR — PRESS F ⚠";
    else if(a && a.resp==="stare") trackMsg="⚠ DO NOT OBSERVE — LOOK AWAY ⚠";
    else if(tuneOn) trackMsg="◄ ► STEER THE NEEDLE — SPACE TO ABORT";
    else if(a) trackMsg = a.kind==="surge"
      ? "⚠ SURGE — SPACE TO TRACK — "+Math.max(0,a.fuse-a.age).toFixed(0)+"s"
      : "SPACE — ENGAGE MANUAL TRACKING";
  }
  trackEl.textContent=trackMsg;
  // power bar
  if(state===ST.PLAY||state===ST.EAS){
    const segs="▮".repeat(Math.ceil(clamp(power,0,100)/10)).padEnd(10,"▯");
    powerEl.textContent="PWR "+segs+" "+Math.round(power)+"%";
    powerEl.className = power<25 ? "low" : "";
  } else powerEl.textContent="";

  // ambient flicker rises with the threat
  if(Math.random()<.02+threat*.02) flickerEl.style.opacity=rnd(0,.05+threat*.04);
  // the screen itself breathes with the ambience
  vigEl.style.opacity = (state===ST.PLAY && threat>.3)
    ? 1-(threat*.16)*(.5+.5*Math.sin(now/1000*1.76)) : 1;

  requestAnimationFrame(frame);
}
function drawPlayChannel(tNow){
  switch(channel){
    case 1: chTestCard(); break;
    case 2: chWeather(tNow); break;
    case 3: chCamera("lot",3); break;
    case 4: chCamera("hall",4); break;
    case 5: chButtons(tNow); break;
    case 6:
      drawStatic(1,3);
      // after 3:30 the static thins and you can see what channel six really is
      if(gameMin>210) drawCableWall(clamp((gameMin-210)/150,0,.55), 5);
      // channel six is where the last operator went
      if(gameMin>90){
        cx.fillStyle="rgba(0,0,0,.45)"; cx.fillRect(0,0,W,H);
        // he turns to face you a little more every hour
        const opFacing=clamp((gameMin-120)/240,0,1);
        drawFigure(W/2, H*.62, 1.05, .75, opFacing);
        // once he has fully turned, he no longer has his face
        if(opFacing>.9) drawMask(W/2, H*.62-108, .22, .3);
        if(opFacing>.85 && Math.random()<.008) say("he sees you seeing him.",3);
      }
      if(gameMin>150 && Math.random()<.03)
        text("HELLO OPERATOR", W/2, 80, 30, "rgba(255,255,255,.5)","center");
      // the intel trade: stare into the static long enough and it names the next channel
      if(ch6WatchT>3)
        text("…c h a n n e l  "+nextTarget+"…", W/2, 130, 24, "rgba(200,255,200,"+clamp((ch6WatchT-3)/2,0,.45)+")","center");
      break;
  }
  if(anomalies[channel]) drawAnomalyOverlay(anomalies[channel]);
  // it is at the door: a dark mass bleeds into every channel's frame
  if(entityPos===2){
    const p=clamp(doorT/doorWindow,0,1);
    const g=cx.createLinearGradient(W,0,W-180-p*140,0);
    g.addColorStop(0,"rgba(0,0,0,"+(.85+p*.15)+")");
    g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=g; cx.fillRect(W-330,0,330,H);
    // pale fingers curling around the frame edge
    cx.strokeStyle="rgba(190,200,180,"+(.35+p*.45)+")"; cx.lineWidth=6; cx.lineCap="round";
    for(let f=0;f<5;f++){
      const fy=H*.3+f*34;
      cx.beginPath(); cx.moveTo(W,fy);
      cx.quadraticCurveTo(W-34-p*54, fy+8, W-28-p*66, fy+22); cx.stroke();
    }
    // one eye in the dark at the frame edge
    if(Math.sin(performance.now()/1000)<.85){
      cx.fillStyle="rgba(225,238,215,"+(.5+p*.4)+")";
      cx.fillRect(W-28-p*40, H*.24, 5, 5);
    }
    // red alarm pulse
    const pulse=.10+Math.abs(Math.sin(performance.now()/160))*.14*(0.4+p);
    cx.strokeStyle="rgba(255,40,40,"+pulse+")"; cx.lineWidth=14;
    cx.strokeRect(7,7,W-14,H-14);
    text("DOOR — FLOOD (F) — "+Math.max(0,doorWindow-doorT).toFixed(0)+"s",
      W/2, 76, 26, (Math.floor(performance.now()/300)%2)?"#f44":"#fa8","center");
    shake=Math.max(shake,p*.25);
  }
  // grit: grime blooming in the corners, something dark running from the top edge
  if(threat>.5){
    for(const [gx,gy] of [[40,40],[W-60,H-80],[80,H-40]]){
      const gg=cx.createRadialGradient(gx,gy,10,gx,gy,150);
      gg.addColorStop(0,"rgba(12,7,5,"+((threat-.5)*.55).toFixed(3)+")");
      gg.addColorStop(1,"rgba(0,0,0,0)");
      cx.fillStyle=gg; cx.fillRect(gx-150,gy-150,300,300);
    }
  }
  if(threat>.6){
    const slot=Math.floor(gameMin/8);
    const n=2+Math.floor(threat*2);
    for(let i=0;i<n;i++){
      const dx=hash(i*9.1+slot)*W;
      const len=(40+hash(i*3.7+slot)*160)*threat + Math.min(60,(gameMin%8)*10);
      const dg=cx.createLinearGradient(dx,0,dx,len);
      dg.addColorStop(0,"rgba(80,8,10,.55)");
      dg.addColorStop(1,"rgba(80,8,10,0)");
      cx.fillStyle=dg;
      cx.fillRect(dx,0,1.6+hash(i*7.3)*1.8,len);
      cx.fillStyle="rgba(80,8,10,.5)";
      cx.beginPath(); cx.arc(dx+1.2,len,2.2,0,7); cx.fill();
    }
  }
  // ambient wear: late-night degradation everywhere
  const hour=gameMin/60;
  if(hour>2) trackingLines(clamp((hour-2)/8,.05,.4)+threat*.1);
  drawGrain(.04+threat*.05 + (power<25 ? (25-power)*.004 : 0));
  // brown-out dimming
  if(power<40){
    cx.fillStyle="rgba(0,0,0,"+((40-power)/40*.38)+")";
    cx.fillRect(0,0,W,H);
  }
}
requestAnimationFrame(frame);

/* debug hook for automated testing (harmless in play) */
window.__dbg={
  get state(){return state;},
  ff:m=>{ // debug time-jump: skip, don't replay, the scripted beats in between
    gameMin=m;
    for(const ev of events) if(m>=ev.t) ev.done=true;
    lastHour=Math.floor(m/60);
  },
  get min(){return gameMin;},
  get threat(){return threat;},
  get integrity(){return integrity;},
  get power(){return power;},
  set power(v){power=v;},
  get entityPos(){return entityPos;},
  set entityPos(v){entityPos=v; if(v===2){doorT=0;doorWindow=8;} else doorT=-1;},
  get doorT(){return doorT;},
  get tuneOn(){return tuneOn;},
  get lock(){return lock;},
  get needle(){return needle;},
  get band(){return band;},
  get anomalies(){return anomalies;},
  spawn:()=>spawnAnomaly(),
  get cause(){return deathCause;},
};
